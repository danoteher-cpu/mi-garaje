<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Garaje</title>
<meta name="description" content="Mantenimiento, averías, piezas y repostajes de tus coches">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Garaje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f6f4;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e6e5df;
  --accent:#2a78d6;--accent-soft:#e8f1fc;--accent-ink:#1c5cab;
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#e1e0d9;--axis:#c3c2b7;--radius:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit}
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.veh-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.veh-avatar{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.veh-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.veh-sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;flex:none;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink2);padding:0}
.icon-btn.sm{width:32px;height:44px;border:0;background:none}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:130px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:7px 0;cursor:pointer}
nav.tabs button.on{color:var(--accent);font-weight:650}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}
h2{font-size:22px;margin:2px 0 14px;letter-spacing:-.01em}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:24px 2px 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;color:inherit}
.row:first-child{border-top:0}
.row:active{background:#f7f7f5}
.row .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#f0efec;color:var(--ink2)}
.row .ico.blue{background:var(--accent-soft);color:var(--accent)}
.row .ico.orange{background:#fdeee7;color:#c4501f}
.row .ico.red{background:#fbe9e9;color:#b02e2e}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-crit{background:#fbe9e9;color:#a52626}.b-warn{background:#fff4d6;color:#7a4f00}.b-good{background:#e6f5e6;color:#006300}.b-none{background:#f0efec;color:#52514e}.b-info{background:var(--accent-soft);color:var(--accent-ink)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .k{font-size:13px;color:var(--ink2)}
.hero .n{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .n small{font-size:16px;font-weight:500;color:var(--ink2)}
.meta{font-size:13px;color:var(--ink2);margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.quick button:active{background:#f7f7f5}
.quick .blue{color:var(--accent)}.quick .orange{color:#c4501f}.quick .red{color:#b02e2e}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles.three{grid-template-columns:repeat(3,1fr)}}
.tiles.tri{grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.tri .tile{padding:10px 12px}
.tiles.tri .n{font-size:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--ink2)}
.tile .n{font-size:21px;font-weight:650;margin-top:2px;letter-spacing:-.01em}
.tile .n small{font-size:13px;font-weight:500;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--crit);border:1px solid #f0c9c9}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(42,120,214,.35);display:grid;place-items:center;cursor:pointer;z-index:9}
.fab svg{width:26px;height:26px}
@media(min-width:760px){.fab{right:calc(50% - 360px + 16px)}}
.empty{text-align:center;color:var(--ink2);padding:30px 16px}
.empty svg{width:42px;height:42px;color:var(--muted);margin-bottom:6px}
.empty p{margin:4px 0 14px}
.okcard{display:flex;align-items:center;gap:10px;color:#006300;font-weight:600}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff}
.progress{height:5px;background:#f0efec;border-radius:3px;overflow:hidden;margin-top:7px}
.progress div{height:100%;border-radius:3px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media(min-width:760px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.sheet-h h4{flex:1;margin:0;font-size:17px}
.sheet-b{overflow-y:auto;padding:16px 18px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f:empty{display:none}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.f{display:block;margin-bottom:12px;min-width:0}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.f input,.f select,.f textarea,.prow input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #d6d5cf;border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.prow input:focus,.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.seg{display:flex;background:#f0efec;border-radius:11px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:650;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kind-mant .only-averia,.kind-averia .only-mant{display:none}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.box>.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.prow{display:grid;grid-template-columns:1fr 82px 74px 32px;gap:6px;margin-bottom:6px;align-items:center}
.prow input{padding:9px 10px;font-size:15px}
.total-line{display:flex;justify-content:space-between;font-weight:650;font-size:16px;padding:4px 2px 12px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f0efec;display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--ink2);cursor:pointer;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:15px;line-height:24px;cursor:pointer;padding:0}
.ph.add{border-style:dashed;color:var(--accent);background:#fff}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:grid;place-items:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:fade .15s}
.rem-sel{max-height:200px;overflow:auto}
/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:8px;padding:8px 10px;font-size:12.5px;white-space:nowrap;z-index:5;display:none;color:var(--ink)}
.tip b{display:block;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.tip .r span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tip i,.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
table.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
table.data th,table.data td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink2);font-weight:600}
.share{display:flex;align-items:center;gap:10px;margin:8px 0}
.share .lab{width:110px;font-size:13.5px}
.share .bar{flex:1;height:10px;background:#f0efec;border-radius:5px;overflow:hidden}
.share .bar div{height:100%;border-radius:5px}
.share .val{width:90px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.welcome{text-align:center;padding:36px 20px}
.welcome .logo{width:72px;height:72px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.welcome .logo svg{width:40px;height:40px}
.welcome h2{margin-bottom:6px}
.welcome p{color:var(--ink2);margin:0 0 20px}
.stack{display:flex;flex-direction:column;gap:10px}
/* escaneo con cámara */
.scan2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scanbtn{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #cfe0f6;background:var(--accent-soft);color:var(--accent);border-radius:12px;cursor:pointer;text-align:left}
.scanbtn b{display:block;font-size:14px;color:var(--ink)}
.scanbtn small{font-size:12px;color:var(--ink2)}
.disc.flash{animation:flash 1.8s}
@keyframes flash{0%,65%{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}}
.paid{padding:10px 0 11px;font-weight:700;font-size:16px;line-height:1.2}
.cam{position:fixed;inset:0;z-index:70;background:#000;color:#fff;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-bottom:14vh}
.cam-box{width:86%;max-width:560px;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55)}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;gap:12px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.cam-t b{display:block;font-size:17px}
.cam-t span{font-size:14px;opacity:.88}
.cam-x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.cam-msg{position:absolute;left:16px;right:16px;top:40%;text-align:center}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
.cam-shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.3);cursor:pointer}
.cam-shutter:active{transform:scale(.94)}
.cam-side{width:76px;background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.cam-side.on{color:#fab219}
.cam .inv{visibility:hidden}
.cam-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
.cam-panel img{width:100%;max-height:130px;object-fit:contain;border-radius:8px;background:#f0efec;margin-bottom:14px;display:block}
.cam-panel .cam-st{text-align:center;color:var(--ink2);margin:6px 0 4px}
.cam-actions{display:flex;gap:10px}.cam-actions .btn{flex:1}
.spin{width:30px;height:30px;border:3px solid #e1e0d9;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:8px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="veh-btn" data-act="switchVeh" id="vehBtn"></button>
  <button class="icon-btn" data-act="settings" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- Iconos ---------- */
const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M6.5 8h5M14 10h2a2 2 0 0 1 2 2v4.5a1.5 1.5 0 0 0 3 0V8.5L18 5.5"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',

  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  chart:'<path d="M3 3v18h18M7 16v-4M12 16V8M17 16v-7"/>',
  car:'<path d="M5 17H3v-5l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 7l2 5v5h-2M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  camera:'<path d="M14.5 4h-5L7.5 6.5H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13" r="3.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  part:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  gauge:'<path d="M12 14l4-4M3.3 19a10 10 0 1 1 17.4 0"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',

let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('mi-garaje',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbReq(store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const req=fn(tx.objectStore(store));tx.oncomplete=()=>res(req?req.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbGet=(s,k)=>idbReq(s,'readonly',st=>st.get(k));
const idbPut=(s,k,v)=>idbReq(s,'readwrite',st=>st.put(v,k));
const idbDel=(s,k)=>idbReq(s,'readwrite',st=>st.delete(k));
const idbKeys=s=>idbReq(s,'readonly',st=>st.getAllKeys());
const idbClear=s=>idbReq(s,'readwrite',st=>st.clear());

function curKm(v){if(!v)return 0;let m=v.km||0;for(const f of of(state.fuel,v))if(f.km>m)m=f.km;for(const s of of(state.services,v))if(s.km>m)m=s.km;return m}
const fillsSorted=v=>of(state.fuel,v).slice().sort((a,b)=>(a.km-b.km)||a.date.localeCompare(b.date));

function consumption(fills){
  const res=[];let lastFull=null,acc=0;
  for(const f of fills){
    if(lastFull){acc+=f.liters||0;if(f.full){const d=f.km-lastFull.km;if(d>0)res.push({id:f.id,date:f.date,km:f.km,l100:acc/d*100,dist:d,liters:acc});lastFull=f;acc=0}}
    else if(f.full){lastFull=f;acc=0}
  }
  return res;
}
function avgConsumption(c){const d=sum(c,x=>x.dist);return d>0?sum(c,x=>x.liters)/d*100:null}

function remInfo(r,km){
  const today=todayISO();
  const dueKm=r.everyKm&&r.lastKm!=null?r.lastKm+r.everyKm:null;
  const dueDate=r.nextDate||(r.everyMonths&&r.lastDate?addMonths(r.lastDate,r.everyMonths):null);
  const kmLeft=dueKm!=null?dueKm-km:null;
  const daysLeft=dueDate?daysBetween(today,dueDate):null;
  let level='ok';
  if(dueKm==null&&!dueDate)level='none';
  else if((kmLeft!=null&&kmLeft<=0)||(daysLeft!=null&&daysLeft<0))level='crit';
  else if((kmLeft!=null&&kmLeft<=1500)||(daysLeft!=null&&daysLeft<=30))level='warn';
  let frac=null;
  if(dueKm!=null)frac=Math.min(1,Math.max(0,(km-r.lastKm)/r.everyKm));
  if(dueDate){let f2;if(r.lastDate&&daysBetween(r.lastDate,dueDate)>0)f2=daysBetween(r.lastDate,today)/daysBetween(r.lastDate,dueDate);else f2=1-daysLeft/365;f2=Math.min(1,Math.max(0,f2));frac=Math.max(frac??0,f2)}
  const bits=[];
  if(kmLeft!=null)bits.push(kmLeft<=0?`pasado por ${fmt.km(-kmLeft)}`:`faltan ${fmt.km(kmLeft)}`);
  if(daysLeft!=null)bits.push(daysLeft<0?`venció el ${fmt.date(dueDate)}`:daysLeft===0?'vence hoy':daysLeft<=45?`vence en ${daysLeft} días`:`vence el ${fmt.date(dueDate)}`);
  const text=bits.join(' · ')||(r.everyKm||r.everyMonths?'Indica cuándo se hizo por última vez':'Indica la próxima fecha');
  return{dueKm,dueDate,kmLeft,daysLeft,level,frac,text};
}

function rangeStart(){

  if(ui.range==='year')return d.getFullYear()+'-01-01';

function monthsBetween(startISO,endISO){
  const out=[];let y=+startISO.slice(0,4),m=+startISO.slice(5,7)-1;const ey=+endISO.slice(0,4),em=+endISO.slice(5,7)-1;
  while(y<ey||(y===ey&&m<=em)){out.push({key:`${y}-${String(m+1).padStart(2,'0')}`,label:MONTHS[m],y});m++;if(m>11){m=0;y++}}
  return out;
}
let chartData=null;
function viewStats(v){
  const start=rangeStart();
  const fuel=of(state.fuel,v).filter(f=>f.date>=start);
  const svcs=of(state.services,v).filter(s=>s.date>=start);
  const fuelT=sum(fuel,f=>f.total),mantT=sum(svcs.filter(s=>s.kind!=='averia'),svcTotal),avT=sum(svcs.filter(s=>s.kind==='averia'),svcTotal);
  const total=fuelT+mantT+avT;
  const kms=[...fuel.map(f=>f.km),...svcs.map(s=>s.km)].filter(x=>x!=null);
  // km recorridos: desde el primer registro del periodo hasta el actual
  const dist=kms.length?Math.max(curKm(v),...kms)-Math.min(...kms):0;
  const cAll=consumption(fillsSorted(v));const c=cAll.filter(x=>x.date>=start);
  let first=[...fuel,...svcs].map(x=>x.date).sort()[0]||todayISO();
  const mStart=ui.range==='all'?first.slice(0,8)+'01':start;
  let months=monthsBetween(mStart,todayISO());
  if(months.length>60)months=months.slice(-60);
  const byM=new Map(months.map(m=>[m.key,[0,0,0]]));
  for(const f of fuel){const a=byM.get(f.date.slice(0,7));if(a)a[0]+=f.total||0}
  for(const s of svcs){const a=byM.get(s.date.slice(0,7));if(a)a[s.kind==='averia'?2:1]+=svcTotal(s)}
  chartData={months:months.map(m=>({...m,values:byM.get(m.key)})),cons:c};
  const chips=[['12','12 meses'],['year','Este año'],['all','Todo']].map(([k,l])=>`<button class="chip ${ui.range===k?'on':''}" data-act="range" data-v="${k}">${l}</button>`).join('');
  const share=(lab,val,col)=>`<div class="share"><span class="lab"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col};margin-right:6px"></i>${lab}</span><span class="bar"><div style="width:${total?val/total*100:0}%;background:${col}"></div></span><span class="val">${fmt.eur0(val)}</span></div>`;
  const rows=chartData.months.filter(m=>m.values.some(x=>x)).map(m=>`<tr><td>${m.label} ${m.y}</td><td>${fmt.eur0(m.values[0])}</td><td>${fmt.eur0(m.values[1])}</td><td>${fmt.eur0(m.values[2])}</td><td><b>${fmt.eur0(m.values[0]+m.values[1]+m.values[2])}</b></td></tr>`).join('');
  return `<h2>Gráficas</h2><div class="chips">${chips}</div>
  <div class="tiles three">
    <div class="tile"><div class="k">Gasto total</div><div class="n">${fmt.eur0(total)}</div></div>
    <div class="tile"><div class="k">Coste por km</div><div class="n">${dist>0?fmt.num(total/dist,2):'—'} <small>€/km</small></div></div>
    <div class="tile"><div class="k">Km recorridos</div><div class="n">${fmt.num(dist)}</div></div>
    <div class="tile"><div class="k">Consumo medio</div><div class="n">${c.length?fmt.num(avgConsumption(c),1):'—'} <small>L/100</small></div></div>
    <div class="tile"><div class="k">Litros</div><div class="n">${fmt.num(sum(fuel,f=>f.liters))} <small>L</small></div></div>
    <div class="tile"><div class="k">Repostajes</div><div class="n">${fuel.length}</div></div>
  </div>
  <h3>Gasto por mes</h3>
  <div class="card"><div class="legend"><span><i style="background:var(--s1)"></i>Gasolina</span><span><i style="background:var(--s2)"></i>Mantenimiento</span><span><i style="background:var(--s3)"></i>Averías</span></div>
  <div class="chart" id="chMonths"></div>
  ${rows?`<details class="tbl"><summary>Ver tabla</summary><table class="data"><tr><th>Mes</th><th>Gasolina</th><th>Mant.</th><th>Averías</th><th>Total</th></tr>${rows}</table></details>`:''}</div>
  <h3>Reparto del gasto</h3>
  <div class="card">${share('Gasolina',fuelT,'var(--s1)')}${share('Mantenimiento',mantT,'var(--s2)')}${share('Averías',avT,'var(--s3)')}</div>
  <h3>Consumo (L/100 km)</h3>
  <div class="card">${c.length>=2?`<div class="legend"><span><i style="background:var(--s1)"></i>Cada repostaje lleno</span><span><i style="background:none;border-top:2px dashed var(--muted);border-radius:0;height:0;width:14px;vertical-align:3px"></i>Media ${fmt.num(avgConsumption(c),1)}</span></div><div class="chart" id="chCons"></div>`:`<div class="empty" style="padding:14px">Necesitas al menos tres repostajes con el depósito lleno para ver la evolución del consumo.</div>`}</div>`;
}
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const shortEur=v=>v>=1000?fmt.num(v/1000,v%1000?1:0)+'k':Math.round(v)+'';
function tipAt(box,tip,html,x,y){
  tip.innerHTML=html;tip.style.display='block';
  const bw=box.clientWidth,tw=tip.offsetWidth;
  let left=x+12;if(left+tw>bw)left=x-tw-12;if(left<0)left=Math.max(0,Math.min(bw-tw,x-tw/2));
  tip.style.left=left+'px';tip.style.top=Math.max(0,y-10)+'px';
}
function drawCharts(){
  if(!chartData)return;
  const cm=$('#chMonths');if(cm)drawMonths(cm,chartData.months);
  const cc=$('#chCons');if(cc)drawCons(cc,chartData.cons);
}
function drawMonths(box,months){
  const W=Math.max(320,box.clientWidth||640),H=220,pl=40,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const totals=months.map(m=>m.values[0]+m.values[1]+m.values[2]);
  const step=niceMax(Math.max(...totals,1)/4),nt=Math.max(1,Math.ceil(Math.max(...totals,1)/step)),max=step*nt;
  const n=months.length,bw=iw/n,barW=Math.max(3,Math.min(26,bw*0.64));
  const cols=['var(--s1)','var(--s2)','var(--s3)'];
  const Y=v=>pt+ih-v/max*ih;
  let g='';
  for(let k=0;k<=nt;k++){const v=step*k,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${k?'var(--grid)':'var(--axis)'}" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${shortEur(v)}</text>`}
  const every=Math.ceil(n/(W/44));
  months.forEach((m,i)=>{
    const cx=pl+bw*i+bw/2,x=cx-barW/2;
    let base=pt+ih;
    const segs=m.values.map((v,j)=>({v,j})).filter(s=>s.v>0);
    segs.forEach((s,idx)=>{
      let h=s.v/max*ih;const top=idx===segs.length-1;
      const gap=idx>0?2:0;let y=base-h;let hh=h-gap;if(hh<1)hh=1;
      if(top&&hh>4){const r=Math.min(4,barW/2);g+=`<path d="M${x},${y+hh} V${y+r} Q${x},${y} ${x+r},${y} H${x+barW-r} Q${x+barW},${y} ${x+barW},${y+r} V${y+hh} Z" fill="${cols[s.j]}"/>`}
      else g+=`<rect x="${x}" y="${y}" width="${barW}" height="${hh}" fill="${cols[s.j]}"/>`;
      base=y;
    });
    if(i%every===0||i===n-1&&n<=12)g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${m.label}${m.key.endsWith('-01')&&n>12?" '"+String(m.y).slice(2):''}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por mes">${g}<rect id="hl" x="0" y="${pt}" width="0" height="${ih}" fill="rgba(0,0,0,.04)" pointer-events="none"/></svg><div class="tip"></div>`;
  const tip=$('.tip',box),svg=$('svg',box),hl=$('#hl',box);
  const names=['Gasolina','Mantenimiento','Averías'];
  const show=e=>{
    const t=e.target.closest('.hit');if(!t){hide();return}
    const i=+t.dataset.i,m=months[i];
    hl.setAttribute('x',pl+bw*i);hl.setAttribute('width',bw);
    const r=box.getBoundingClientRect();
    tipAt(box,tip,`<b>${m.label} ${m.y}</b>${m.values.map((v,j)=>`<div class="r"><span><i style="background:${cols[j]}"></i>${names[j]}</span><span>${fmt.eur(v)}</span></div>`).join('')}<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Total</span><span>${fmt.eur(totals[i])}</span></div>`,e.clientX-r.left,e.clientY-r.top-60);
  };
  const hide=()=>{tip.style.display='none';hl.setAttribute('width',0)};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);
}
function drawCons(box,c){
  const W=Math.max(320,box.clientWidth||640),H=200,pl=36,pr=12,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const vals=c.map(x=>x.l100);
  let lo=Math.floor(Math.min(...vals)-0.5),hi=Math.ceil(Math.max(...vals)+0.5);if(lo<0)lo=0;if(hi-lo<2)hi=lo+2;
  const t0=new Date(c[0].date).getTime(),t1=new Date(c[c.length-1].date).getTime();
  const X=i=>t1>t0?pl+(new Date(c[i].date).getTime()-t0)/(t1-t0)*iw:pl+iw*(i/(c.length-1||1));
  const Y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  const avg=avgConsumption(c);
  let g='';const step=(hi-lo)/4;
  for(let k=0;k<=4;k++){const v=lo+step*k,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${k?'var(--grid)':'var(--axis)'}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt.num(v,v%1?1:0)}</text>`}
  // etiquetas de fecha: primera, media y última
  const idxs=[...new Set([0,Math.floor((c.length-1)/2),c.length-1])];
  idxs.forEach(i=>{const d=new Date(c[i].date+'T00:00:00');g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===c.length-1?'end':'middle'}">${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`});
  if(avg){const y=Y(avg);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="4 4"/>`}
  const pts=c.map((x,i)=>`${X(i)},${Y(x.l100)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(c.length<=40)c.forEach((x,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(x.l100)}" r="3.5" fill="var(--s1)" stroke="#fff" stroke-width="2"/>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Consumo">${g}<line id="xh" y1="${pt}" y2="${pt+ih}" stroke="var(--axis)" visibility="hidden"/><circle id="xp" r="5" fill="var(--s1)" stroke="#fff" stroke-width="2" visibility="hidden"/><rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" id="ov"/></svg><div class="tip"></div>`;
  const svg=$('svg',box),tip=$('.tip',box),xh=$('#xh',box),xp=$('#xp',box);
  const show=e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;
    let bi=0,bd=1e9;c.forEach((x,i)=>{const d=Math.abs(X(i)-sx);if(d<bd){bd=d;bi=i}});
    const x=X(bi),y=Y(c[bi].l100);
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    xp.setAttribute('cx',x);xp.setAttribute('cy',y);xp.setAttribute('visibility','visible');
    const br=box.getBoundingClientRect();
    tipAt(box,tip,`<b>${fmt.date(c[bi].date)}</b><div class="r"><span>Consumo</span><span>${fmt.num(c[bi].l100,2)} L/100</span></div><div class="r"><span>Recorrido</span><span>${fmt.km(c[bi].dist)}</span></div><div class="r"><span>Litros</span><span>${fmt.num(c[bi].liters,2)} L</span></div>`,x*r.width/W+(r.left-br.left),y*r.height/H-40);
  };
  const hide=()=>{tip.style.display='none';xh.setAttribute('visibility','hidden');xp.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);
}

let sheet=null; // {el, photos, added, removed}
function field(name,label,val,o={}){
  return `<label class="f ${o.cls||''}"><span>${label}</span><input name="${name}" type="${o.type||'text'}" ${o.mode?`inputmode="${o.mode}"`:''} value="${esc(val??'')}" placeholder="${esc(o.ph||'')}" ${o.list?`list="${o.list}"`:''} autocomplete="off" ${o.attrs||''}></label>`;
}
function selectF(name,label,opts,val){return `<label class="f"><span>${label}</span><select name="${name}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`}
function areaF(name,label,val,ph=''){return `<label class="f"><span>${label}</span><textarea name="${name}" placeholder="${esc(ph)}">${esc(val||'')}</textarea></label>`}
const datalist=(id,items)=>`<datalist id="${id}">${[...new Set(items.filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
function readForm(el){const o={};$$('[name]',el).forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:i.value.trim()});return o}

function beginSheet(photos){closeSheet(false);sheet={photos:[...(photos||[])],added:[],removed:[]}}
function openSheet({title,body,onSave,onDelete,saveLabel='Guardar',cls='',onOpen}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h4>${esc(title)}</h4><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x')}</button></div><form class="sheet-b ${cls}" novalidate>${body}</form><div class="sheet-f">${onDelete?`<button class="btn danger" data-act="sheetDel">Eliminar</button>`:''}${onSave?`<button class="btn" data-act="sheetSave">${esc(saveLabel)}</button>`:''}</div></div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  sheet=sheet||{photos:[],added:[],removed:[]};
  Object.assign(sheet,{el:ov,form:$('form',ov),onSave,onDelete});
  ov.addEventListener('pointerdown',e=>{if(e.target===ov)sheet&&(sheet.downOutside=true)});
  ov.addEventListener('click',e=>{if(e.target===ov&&sheet&&sheet.downOutside)closeSheet(false)});
  sheet.form.addEventListener('submit',e=>e.preventDefault());
  if($('[data-photos]',ov))renderPhotos();
  onOpen&&onOpen(sheet.form);
}
async function closeSheet(committed){
  if(!sheet)return;const s=sheet;sheet=null;
  if(!committed&&s.added.length)delPhotos(s.added);
  if(s.el)s.el.remove();
  if(!$('.overlay'))document.body.style.overflow='';
}
async function sheetSave(){
  if(!sheet||!sheet.onSave)return;
  const s=sheet;
  const ok=await s.onSave(readForm(s.form),s.form,s.photos.slice());
  if(ok===false)return;
  if(s.removed.length)delPhotos(s.removed);
  await closeSheet(true);await persist();render();
}
async function sheetDel(){
  if(!sheet||!sheet.onDelete)return;
  if(!confirm('¿Seguro que quieres eliminarlo? No se puede deshacer.'))return;
  const s=sheet;await s.onDelete();
  await closeSheet(true);await persist();render();toast('Eliminado');
}

const photoWidget=()=>`<div class="f"><span>Fotos y facturas</span><div class="photos" data-photos></div><input type="file" accept="image/*,application/pdf" multiple hidden data-photo-input></div>`;
async function renderPhotos(){
  if(!sheet)return;const box=$('[data-photos]',sheet.el);if(!box)return;
  const items=await Promise.all(sheet.photos.map(async id=>({id,p:await getPhoto(id)})));
  box.innerHTML=items.filter(x=>x.p).map(({id,p})=>`<div class="ph" data-act="viewPhoto" data-id="${id}" role="button" tabindex="0">${p.type==='application/pdf'?'PDF':`<img src="${photoURL(id,p.blob)}" alt="">`}<button type="button" class="x" data-act="rmPhoto" data-id="${id}" aria-label="Quitar">×</button></div>`).join('')+`<button type="button" class="ph add" data-act="addPhoto" aria-label="Añadir foto">${ic('camera')}</button>`;
  const inp=$('[data-photo-input]',sheet.el);
  inp.onchange=async()=>{
    if(!db){toast('Este navegador no permite guardar fotos');return}
    for(const file of inp.files){
      const isPdf=file.type==='application/pdf';
      const blob=isPdf?file:await compressImage(file);
      const id='ph_'+uid();
      await idbPut('photos',id,{blob,type:isPdf?'application/pdf':(blob.type||'image/jpeg'),name:file.name,date:todayISO()});
      if(!sheet)return;
      sheet.photos.push(id);sheet.added.push(id);
    }
    inp.value='';renderPhotos();
  };
}
async function compressImage(file){
  try{
    const bmp=await createImageBitmap(file);const max=1600;let w=bmp.width,h=bmp.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));return b||file;
  }catch{return file}
}
async function viewPhoto(id){
  const p=await getPhoto(id);if(!p)return;const url=photoURL(id,p.blob);
  if(p.type==='application/pdf'){window.open(url,'_blank');return}
  const v=document.createElement('div');v.className='viewer';v.innerHTML=`<img src="${url}" alt=""><button class="icon-btn" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px" aria-label="Cerrar">${ic('x')}</button>`;
  v.onclick=()=>v.remove();document.body.appendChild(v);
}

  if(station){const m=fs.find(x=>(x.station||'').trim().toLowerCase()===station.trim().toLowerCase());if(m)return m.discount}
  return null;
}

function parseKm(texts,ctx){
  const score=new Map();
  for(const t of texts)for(const tok of t.match(/\d[\d.,']*\d|\d/g)||[]){
    const d0=tok.replace(/\D/g,'');
    // el ruido de los bordes suele pegar dígitos delante: prueba también quitándolos
    for(let cut=0;cut<=2;cut++){
      const d=d0.slice(cut);if(d.length<3||d.length>7)continue;const n=+d;
      const plaus=ctx.lastKm&&n>=ctx.lastKm-50&&n<=ctx.lastKm+6000;
      if(cut&&!plaus)continue;
      let s=(score.get(n)||0)+(cut?0.5:1)+(d.length>=5?1:0);
      if(ctx.lastKm){if(plaus)s+=5;else if(n<ctx.lastKm)s-=2}
      score.set(n,s);
    }
  }
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,4);
}
const kmOk=(list,ctx)=>list.length&&ctx.lastKm>0&&list[0]>=ctx.lastKm-50&&list[0]<=ctx.lastKm+6000;

// Junta los números leídos en todas las pasadas (con cuántas veces aparece cada uno)
function poolTokens(texts){
  const pool=new Map();
  const add=(t,guess)=>{const k=t+(guess?'~':'');const p=pool.get(k)||{t,guess,n:0};p.n++;pool.set(k,p)};
  for(const txt of texts)for(let tok of txt.match(/[\d.,]+/g)||[]){
    tok=tok.replace(/^[.,]+|[.,]+$/g,'').replace(/,/g,'.');if(tok.replace(/\D/g,'').length<2)continue;
    if((tok.match(/\./g)||[]).length>1)tok=tok.replace(/\.(?=.*\.)/g,'');
    add(tok,false);
    // el ruido suele pegar dígitos delante (rótulos, bordes): prueba quitando 1 o 2
    for(let k=1;k<=2;k++){const s=tok.slice(k);if(s.replace(/\D/g,'').length>=2&&!s.startsWith('.'))add(s,true)}

// Interpreta un número para un papel concreto (importe/litros con 2 decimales, precio con 3)
function asRole(p,dec){
  const t=p.t;
  if(t.includes('.')){const v=parseFloat(t);return isNaN(v)?null:{v,g:p.guess?1:0,dec:(t.split('.')[1]||'').length}}

  return{v:parseFloat(t.slice(0,-dec)+'.'+t.slice(-dec)),g:p.guess?2:1,dec};
}
// Busca importe, litros y precio que cuadren (litros × precio = importe, al céntimo)
function parsePump(texts,ctx){
  const pool=poolTokens(texts);
  const T=pool.map(p=>({p,r:asRole(p,2)})).filter(x=>x.r&&x.r.v>=2&&x.r.v<=400);
  const L=pool.map(p=>({p,r:asRole(p,2)})).filter(x=>x.r&&x.r.v>=1&&x.r.v<=200);
  const P=pool.map(p=>({p,r:asRole(p,3)})).filter(x=>x.r&&x.r.v>=0.7&&x.r.v<=3);
  const sup=p=>Math.log2(1+p.n);
  let best=null,pair=null;
  for(const t of T)for(const l of L){
    if(t.p===l.p)continue;
    const ratio=t.r.v/l.r.v;
    if(ratio>=0.7&&ratio<=3){
      let s=(t.r.g+l.r.g)*0.6-(sup(t.p)+sup(l.p))*0.5+(t.r.dec===2?0:0.6)+(l.r.dec===2?0:0.4);
      if(ctx.lastPrice)s+=Math.min(2,Math.abs(ratio-ctx.lastPrice)*5);
      if(!pair||s<pair.s)pair={s,total:t.r.v,liters:l.r.v,price:+ratio.toFixed(3)};
    }
    for(const p of P){
      if(p.p===t.p||p.p===l.p)continue;
      if(!pumpFits(t.r.v,l.r.v,p.r.v))continue;
      let s=Math.abs(l.r.v*p.r.v-t.r.v)*10+(t.r.g+l.r.g+p.r.g)*0.6-(sup(t.p)+sup(l.p)+sup(p.p))*0.5+(t.r.dec===2?0:0.6)+(l.r.dec===2?0:0.4)+(p.r.dec===3?0:0.6);
      if(ctx.lastPrice)s+=Math.min(1,Math.abs(p.r.v-ctx.lastPrice)*1.5);
      if(!best||s<best.s)best={s,total:t.r.v,liters:l.r.v,price:p.r.v,sup:t.p.n+l.p.n+p.p.n,g:t.r.g+l.r.g+p.r.g};
    }

}

  for(let i=0;i<w*h;i++)if(m[i]===2)m[i]=0;

function readSegRows(m,w,h){
  clearLongRuns(m,w,h);
  let cs=components(m,w,h).filter(c=>{const cw=c.x1-c.x0+1,ch=c.y1-c.y0+1;return c.n>=Math.max(6,w*h*0.00015)&&cw<0.6*w&&ch<0.85*h&&ch/cw<12&&cw/ch<12});
  const g=groupDigits(cs).filter(b=>{const bh=b.y1-b.y0+1,bw=b.x1-b.x0+1;return bh>=h*0.06&&bh/bw>=1.05&&bh/bw<=9});
  // filas: cajas de altura parecida y alineadas
  g.sort((a,b)=>(a.y0+a.y1)-(b.y0+b.y1));
  const rows=[];
  for(const b of g){const bh=b.y1-b.y0+1,cy=(b.y0+b.y1)/2;
    const r=rows.find(r=>Math.abs(r.cy-cy)<0.35*r.h&&bh>0.7*r.h&&bh<1.4*r.h);
    if(r){r.items.push(b);r.cy=(r.cy*(r.items.length-1)+cy)/r.items.length}else rows.push({cy,h:bh,items:[b]})}

  for(const r of rows){
    const it=r.items.sort((a,b)=>a.x0-b.x0);if(it.length<2)continue;
    const widths=it.map(b=>b.x1-b.x0+1).sort((a,b)=>a-b),medW=widths[Math.floor(widths.length*0.75)];
    let bestTxt=null,bestScore=-1;
    for(let s=-0.1;s<=0.31;s+=0.05){
      let txt='',score=0,prev=null;
      for(const b of it){
        const bw=b.x1-b.x0+1;
        // un "1" ocupa solo la parte derecha de su casilla: no cuenta ese hueco como separación
        const pad=bw<0.5*medW?medW-bw:0;
        if(prev&&b.x0-prev.x1-pad>0.8*medW)txt+=' ';
        let r1=null;
        if(bw<0.5*medW)r1={d:'1',exact:true};else r1=decodeDigit(m,w,b,s);
        if(r1){txt+=r1.d;score+=r1.exact?1:0.5}else txt+='?';
        prev=b;
      }
      if(score>bestScore){bestScore=score;bestTxt=txt}
    }
    const parts=bestTxt.split(' ').map(p=>p.replace(/\?/g,'')).filter(p=>p.length>=2);
    if(parts.length)out.push(parts.join(' '));
  }
  return out.join('\n');
}
// Varias pasadas (polaridad, grosor y umbral) → lista de textos para los analizadores
function segRead(crop,kind){
  const texts=[];

    const G=toGrayBest(crop,W);
    for(const light of [true,false])for(const f of kind==='km'?[0.15,0.25]:[0.03,0.05]){
      const t=strokeResponse(G,Math.max(2,Math.round(G.h*f)),light),P=pctl(t,0.9);
      for(const k of [0.65,0.9]){const th=Math.max(12,P*k),m=new Uint8Array(G.w*G.h);for(let i=0;i<m.length;i++)m[i]=t[i]>th?1:0;const txt=readSegRows(m,G.w,G.h);if(txt)texts.push(txt)}
    }
  }

// Engorda los trazos oscuros (filtro mínimo): une los segmentos sueltos de las pantallas de 7 segmentos
function thicken(c,r){
  const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,a=new Uint8Array(w*h);for(let i=0;i<w*h;i++)a[i]=d[i*4];
  const b=new Uint8Array(w*h);for(let y=0;y<h;y++){const o=y*w;for(let i=0;i<w;i++){let m=255;for(let k=Math.max(0,i-r),e=Math.min(w-1,i+r);k<=e;k++)if(a[o+k]<m)m=a[o+k];b[o+i]=m}}
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;const x2=c2.getContext('2d'),im=x2.createImageData(w,h);
  for(let i=0;i<w;i++)for(let y=0;y<h;y++){let m=255;for(let k=Math.max(0,y-r),e=Math.min(h-1,y+r);k<=e;k++)if(b[k*w+i]<m)m=b[k*w+i];const p=(y*w+i)*4;im.data[p]=im.data[p+1]=im.data[p+2]=m;im.data[p+3]=255}

}
async function readNumbers(crop,kind,ctx,onStep){
  // varias pasadas: distintos tamaños y grosores; cada una acierta trozos distintos
  const bins={};const binAt=W=>bins[W]||(bins[W]=prepCanvas(toGray(crop,W),'bin'));
  const thick=(W,f)=>()=>{const b=binAt(W);return thicken(b,Math.max(1,Math.round(b.width*f)))};
  const plain=W=>()=>binAt(W);
  const runs=kind==='km'
    ?[['ssd_int',plain(600)],['ssd_int',plain(400)],['ssd_int',thick(600,0.004)],['eng',plain(600)],['ssd_int',plain(900)],['ssd_int',thick(900,0.004)],['eng',thick(400,0.004)]]
    :[['ssd_int',plain(700)],['ssd_int',plain(500)],['ssd_int',thick(700,0.004)],['ssd_int',plain(1000)],['eng',plain(700)],['ssd_int',thick(500,0.004)],['ssd_int',thick(1000,0.004)],['eng',plain(500)]];

  const texts=[];let lastErr=null;
  try{texts.push(...segRead(crop,kind))}catch(e){console.warn(e)}
  if(texts.length){
    if(kind==='km'){const r=parseKm(texts,ctx);const reps=r.length?texts.filter(s=>s.includes(String(r[0]))).length:0;if(r.length&&(kmOk(r,ctx)||(!ctx.lastKm&&String(r[0]).length>=5&&reps>=2))){window.__ocrTexts=texts;return{res:r,preview:binAt(600)}}}
    else{const r=parsePump(texts,ctx);if(r&&r.ok){window.__ocrTexts=texts;return{res:r,preview:binAt(700)}}}
  }
  onStep(0,runs.length,!ocrWorkers.ssd_int);
  for(let k=0;k<runs.length;k++){
    const[lang,img]=runs[k];
    onStep(k,runs.length,!ocrWorkers[lang]);
    try{const w=await ocrWorker(lang);const{data}=await w.recognize(img());texts.push(data.text)}catch(e){console.warn(e);lastErr=e;continue}
    if(k<2)continue;
    if(kind==='km'){if(kmOk(parseKm(texts,ctx),ctx)&&k>=3)break}
    else if(k>=3){const r=parsePump(texts,ctx);if(r&&r.strong)break}
  }
  window.__ocrTexts=texts;
  if(!texts.length)throw lastErr||new Error('ocr');

}

      title.addEventListener('input',()=>{if(!isNew)return;$$('[data-rem]',form).forEach(c=>{if(touched.has(c.dataset.rem))return;const r=byId(state.reminders,c.dataset.rem);c.checked=remMatches(r,title.value)})});
    },
    onSave:(d,form,photos)=>{
      const km=pInt(d.km);
      if(!d.title){toast(d.kind==='averia'?'Describe la avería':'Indica qué se ha hecho');return false}
      const remIds=$$('[data-rem]',form).filter(c=>c.checked).map(c=>c.dataset.rem);
      Object.assign(s,{kind:d.kind,date:d.date||todayISO(),km,title:d.title,workshop:d.workshop,parts:readParts(form),labor:pNum(d.labor),notes:d.notes,photos,reminderIds:remIds});
      if(d.kind==='averia')Object.assign(s,{status:d.status,symptoms:d.symptoms,diagnosis:d.diagnosis});
      if(isNew){s.id=uid();s.vehicleId=v.id;state.services.push(s)}
      for(const id of remIds){
        const r=byId(state.reminders,id);if(!r)continue;
        if(!r.lastDate||s.date>=r.lastDate){r.lastDate=s.date;if(km!=null)r.lastKm=km;if(r.nextDate&&r.nextDate<=addMonths(s.date,1))r.nextDate=null}
      }
      toast('Guardado'+(remIds.length?` · ${remIds.length} aviso${remIds.length>1?'s':''} actualizado${remIds.length>1?'s':''}`:''));
    },
    onDelete:isNew?null:async()=>{await delPhotos(s.photos);state.services=state.services.filter(x=>x.id!==s.id)}});
}

/* avisos */
function remForm(r){
  const v=veh();const isNew=!r;r=r||{name:''};
  const info=isNew?null:remInfo(r,curKm(v));
  beginSheet();
  openSheet({title:isNew?'Nuevo aviso':r.name,body:`
    ${info?`<div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:14px">${esc(info.text)}</span>${badge(info.level)}</div>
    <button type="button" class="btn sec block" data-act="remDone" data-id="${r.id}" style="margin-bottom:16px">${ic('check','i s')} Hecho hoy (${fmt.km(curKm(v))})</button>`:''}
    ${field('name','Nombre',r.name,{ph:'Ej.: Cambio de aceite'})}
    <div class="box"><div class="lbl">Cada cuánto</div><div class="grid2">${field('everyKm','Cada (km)',r.everyKm,{mode:'numeric',ph:'15000'})}${field('everyMonths','Cada (meses)',r.everyMonths,{mode:'numeric',ph:'12'})}</div><p class="hint" style="margin:0">Lo que llegue antes. Deja vacío lo que no aplique.</p></div>
    <div class="box"><div class="lbl">Última vez que se hizo</div><div class="grid2">${field('lastDate','Fecha',r.lastDate,{type:'date'})}${field('lastKm','Kilómetros',r.lastKm,{mode:'numeric'})}</div></div>
    ${field('nextDate','Próxima fecha fija (opcional)',r.nextDate,{type:'date'})}
    <p class="hint">Para ITV, seguro o impuesto: pon la fecha de vencimiento y te avisará 30 días antes.</p>`,
    onSave:d=>{
      if(!d.name){toast('Ponle un nombre');return false}
      Object.assign(r,{name:d.name,everyKm:pInt(d.everyKm),everyMonths:pInt(d.everyMonths),lastDate:d.lastDate||null,lastKm:pInt(d.lastKm),nextDate:d.nextDate||null});
      if(isNew){r.id=uid();r.vehicleId=v.id;r.match=[];state.reminders.push(r)}
      toast('Aviso guardado');
    },
    onDelete:isNew?null:()=>{state.reminders=state.reminders.filter(x=>x.id!==r.id)}});
}

/* selector de vehículo y ajustes */
function switchVehSheet(){
  beginSheet();
  openSheet({title:'Mis vehículos',body:`<div class="list">${state.vehicles.map(v=>`<button type="button" class="row" data-act="selVeh" data-id="${v.id}"><span class="ico blue">${ic('car')}</span><span class="main"><div class="t">${esc(v.name||v.brand)}</div><div class="s">${esc([v.brand,v.model,v.plate].filter(Boolean).join(' · '))} · ${fmt.km(curKm(v))}</div></span>${v.id===veh().id?`<span class="badge b-info">${ic('check','i s')}</span>`:''}</button>`).join('')}</div>
  <div class="stack" style="margin-top:14px"><button type="button" class="btn sec block" data-act="addVeh">${ic('plus','i s')} Añadir vehículo</button><button type="button" class="btn sec block" data-act="editVeh">Editar ${esc(veh().name||veh().brand)}</button></div>`});
}
async function settingsSheet(){
  beginSheet();
  let usage='';
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();usage=`Espacio usado: ${fmt.num((e.usage||0)/1048576,1)} MB`}}catch{}
  let persisted=false;try{persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false}catch{}
  openSheet({title:'Ajustes y copias',body:`
    <h3 style="margin-top:0">Copia de seguridad</h3>
    <p class="hint" style="margin:0 0 12px">Los datos se guardan solo en este dispositivo. Haz una copia de vez en cuando y guárdala en Drive, el correo o el PC.</p>
    <div class="stack">
      <button type="button" class="btn block" data-act="export">${ic('download','i s')} Exportar copia (con fotos)</button>
      <button type="button" class="btn sec block" data-act="import">${ic('upload','i s')} Restaurar desde una copia</button>
      <button type="button" class="btn sec block" data-act="csv">Exportar repostajes y taller (Excel/CSV)</button>
    </div>
    <h3>Vehículos</h3>
    <div class="stack"><button type="button" class="btn sec block" data-act="addVeh">${ic('plus','i s')} Añadir vehículo</button>${state.vehicles.length?`<button type="button" class="btn sec block" data-act="editVeh">Editar vehículo actual</button>`:''}</div>
    <h3>Datos</h3>
    <p class="hint" style="margin:0 0 12px">${usage}${usage?' · ':''}${persisted?'Almacenamiento protegido ✓':'El navegador podría borrar los datos si falta espacio: instala la app y haz copias.'}</p>
    <button type="button" class="btn danger block" data-act="wipe">${ic('trash','i s')} Borrar todos los datos</button>`});
}

/* exportar / importar */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function saveFile(blob,name){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function exportData(){
  toast('Preparando copia…');
  const photos={};
  if(db)for(const k of await idbKeys('photos')){const p=await idbGet('photos',k);if(p)photos[k]={type:p.type,name:p.name,date:p.date,data:await blobToDataURL(p.blob)}}
  const blob=new Blob([JSON.stringify({app:'mi-garaje',version:1,exported:new Date().toISOString(),state,photos})],{type:'application/json'});
  await saveFile(blob,`mi-garaje-${todayISO()}.json`);
}
async function importData(file){
  let data;try{data=JSON.parse(await file.text())}catch{toast('El archivo no es válido');return}
  if(!data||data.app!=='mi-garaje'||!data.state){toast('No es una copia de Mi Garaje');return}
  if(!confirm(`Copia del ${fmt.date((data.exported||'').slice(0,10))} con ${data.state.vehicles.length} vehículo(s). Se reemplazarán TODOS los datos actuales. ¿Continuar?`))return;
  if(db){await idbClear('photos');for(const[k,p]of Object.entries(data.photos||{})){const blob=await (await fetch(p.data)).blob();await idbPut('photos',k,{blob,type:p.type,name:p.name,date:p.date})}}
  photoURLs.forEach(u=>URL.revokeObjectURL(u));photoURLs.clear();
  state=Object.assign({version:1,vehicles:[],fuel:[],services:[],reminders:[],currentId:null},data.state);
  await closeSheet(true);await persist();ui.tab='home';render();toast('Copia restaurada');
}
function exportCSV(){
  const q=x=>{x=x==null?'':String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const n=x=>x==null?'':String(x).replace('.',',');
  const vn=id=>{const v=byId(state.vehicles,id);return v?(v.name||v.brand):''};
  const lines=['Tipo;Vehículo;Fecha;Km;Concepto;Litros;€/L;Descuento €/L;Lleno;Taller/Gasolinera;Piezas;Mano de obra;Total;Estado;Notas'];
  for(const f of state.fuel)lines.push(['Repostaje',vn(f.vehicleId),f.date,f.km,'',n(f.liters),n(f.price),n(f.discount),f.full?'Sí':'No',f.station,'','',n(f.total),'',f.notes].map(q).join(';'));
  for(const s of state.services)lines.push([s.kind==='averia'?'Avería':'Mantenimiento',vn(s.vehicleId),s.date,s.km,s.title,'','','','',s.workshop,(s.parts||[]).map(p=>[p.name,p.ref&&`(${p.ref})`,p.cost!=null&&n(p.cost)+'€'].filter(Boolean).join(' ')).join(' | '),n(s.labor),n(svcTotal(s)),s.kind==='averia'?(STATUS[s.status]||[])[1]:'',s.notes].map(q).join(';'));
  lines.sort((a,b)=>0);
  saveFile(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}),`mi-garaje-${todayISO()}.csv`);
}

/* ---------- Acciones ---------- */
const ACT={
  tab:el=>{ui.tab=el.dataset.v;render();window.scrollTo(0,0)},
  taller:el=>{ui.taller=el.dataset.v;render()},
  range:el=>{ui.range=el.dataset.v;render()},
  addFuel:()=>fuelForm(),
  editFuel:el=>fuelForm(byId(state.fuel,el.dataset.id)),
  addMant:()=>svcForm(null,'mant'),
  addAveria:()=>svcForm(null,'averia'),
  editSvc:el=>svcForm(byId(state.services,el.dataset.id)),
  addRem:()=>remForm(),
  editRem:el=>remForm(byId(state.reminders,el.dataset.id)),
  addDefaults:async()=>{addDefaultReminders(veh());await persist();render()},
  remDone:async el=>{const r=byId(state.reminders,el.dataset.id);const v=veh();r.lastDate=todayISO();r.lastKm=curKm(v);r.nextDate=null;await closeSheet(true);await persist();render();toast('Aviso actualizado'+(r.everyKm||r.everyMonths?'':' · pon la próxima fecha'))},
  updKm:()=>updKmForm(),
  switchVeh:()=>{if(state.vehicles.length)switchVehSheet()},
  selVeh:async el=>{state.currentId=el.dataset.id;await closeSheet(true);await persist();render()},
  addVeh:()=>vehicleForm(),
  editVeh:()=>vehicleForm(veh()),
  settings:()=>settingsSheet(),
  export:()=>exportData(),
  csv:()=>exportCSV(),
  import:()=>{const i=$('#importInput');i.value='';i.click()},
  wipe:async()=>{if(!confirm('Se borrarán TODOS los vehículos, registros y fotos de este dispositivo. ¿Seguro?'))return;if(!confirm('Última confirmación: ¿borrar todo? (Te recomendamos exportar una copia antes)'))return;if(db)await idbClear('photos');state={version:1,vehicles:[],fuel:[],services:[],reminders:[],currentId:null};await closeSheet(true);await persist();render();toast('Datos borrados')},
  scanKm:()=>scanFlow('km'),
  scanPump:()=>scanFlow('pump'),
  setDisc:el=>{if(!sheet)return;const i=$('[name=discount]',sheet.form);i.value=el.dataset.v?discStr(+el.dataset.v):'';i.dispatchEvent(new Event('input',{bubbles:true}))},
  closeSheet:()=>closeSheet(false),
  sheetSave:()=>sheetSave(),
  sheetDel:()=>sheetDel(),
  addPhoto:()=>{if(sheet)$('[data-photo-input]',sheet.el).click()},
  rmPhoto:el=>{if(!sheet)return;const id=el.dataset.id;sheet.photos=sheet.photos.filter(x=>x!==id);if(sheet.added.includes(id)){sheet.added=sheet.added.filter(x=>x!==id);delPhotos([id])}else sheet.removed.push(id);renderPhotos()},
  viewPhoto:el=>viewPhoto(el.dataset.id),
  addPart:()=>{const f=sheet.form;$('.parts',f).insertAdjacentHTML('beforeend',partRow());f._updTotal&&f._updTotal();const rs=$$('.prow',f);$('input',rs[rs.length-1]).focus()},
  rmPart:el=>{const f=sheet.form;el.closest('.prow').remove();f._updTotal&&f._updTotal()},
  kind:el=>{const f=sheet.form,k=el.dataset.v;$('[name=kind]',f).value=k;f.classList.remove('kind-mant','kind-averia');f.classList.add('kind-'+k);$$('.seg button',f).forEach(b=>b.classList.toggle('on',b.dataset.v===k));const h=$('.sheet-h h4',sheet.el);if(/^Nuev/.test(h.textContent))h.textContent=k==='averia'?'Nueva avería':'Nuevo mantenimiento'},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  e.preventDefault();e.stopPropagation();fn(el);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet&&!$('.cam'))closeSheet(false)});
$('#importInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)importData(f)});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(ui.tab==='stats')drawCharts()},150)});

/* ---------- Arranque ---------- */
(async()=>{
  await load();render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
